<script>
function $(id){return document.getElementById(id)}
function toggle(n){$('card-'+n).classList.toggle('open')}

function setStepStatus(n,status,text){
  const el=$('step-'+n),st=$('status-'+n);
  el.className='step-num '+status;
  if(text){st.textContent=text;st.className='card-status '+status;st.style.display='';}
  else{st.style.display='none';}
}

async function api(url,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  return r.json();
}

async function loadStatus(){
  const r=await api('/api/status');
  if(!r.success)return;
  const d=r.data;
  $('node-ver').textContent=d.nodeVersion;

  // 鐜妫€娴?  $('env-node').textContent=d.nodeVersion;
  $('env-node-badge').innerHTML='<span class="card-status done">宸插畨瑁?/span>';

  if(d.mysqlInstalled){
    $('env-mysql').textContent=d.mysqlVersion||'宸插畨瑁?;
    $('env-mysql-actions').innerHTML='<span class="card-status done">宸插畨瑁?/span>';
    $('env-mysql-install').style.display='none';
    $('env-create-db').style.display='';
    setStepStatus('env','done','灏辩华');
  }else{
    $('env-mysql').textContent='鏈畨瑁?;
    $('env-mysql-actions').innerHTML='<span class="card-status error">鏈畨瑁?/span>';
    $('env-mysql-install').style.display='';
    $('env-create-db').style.display='none';
    setStepStatus('env','error','闇€瀹夎 MySQL');
  }

  if(d.envExists&&d.envConfig){
    setStepStatus(1,'done','宸查厤缃?);
    $('DB_HOST').value=d.envConfig.DB_HOST||'';
    $('DB_PORT').value=d.envConfig.DB_PORT||'';
    $('DB_USER').value=d.envConfig.DB_USER||'';
    $('DB_NAME').value=d.envConfig.DB_NAME||'';
    $('PORT').value=d.envConfig.PORT||'3000';
  }
  if(d.serverDepsInstalled&&d.clientDepsInstalled)setStepStatus(2,'done','宸插畨瑁?);
  if(d.serverBuilt&&d.clientBuilt)setStepStatus(5,'done','宸叉瀯寤?);
  if(d.serverReady){
    setStepStatus(6,'done','杩愯涓?);
    showServerRunning(d.serverPort);
  }else if(d.serverRunning){
    setStepStatus(6,'running','鍚姩涓?..');
  }
}

async function installMysql(){
  const con=$('console-mysql');
  con.textContent='姝ｅ湪鍚姩 MySQL 瀹夎鑴氭湰...\n';
  const r=await api('/api/install-mysql','POST');
  if(!r.success){con.textContent='閿欒: '+r.error;return;}
  const taskId=r.taskId;
  const timer=setInterval(async()=>{
    const tr=await api('/api/task/'+taskId);
    if(!tr.success)return;
    con.textContent=tr.data.output;
    con.scrollTop=con.scrollHeight;
    if(tr.data.status!=='running'){
      clearInterval(timer);
      if(tr.data.status==='done'){
        setTimeout(()=>loadStatus(),2000);
      }
    }
  },1500);
}

async function createDb(){
  const pwd=$('env-db-pwd').value;
  $('msg-env-db').innerHTML='<div class="info-box">姝ｅ湪鍒涘缓鏁版嵁搴?..</div>';
  const r=await api('/api/create-database','POST',{DB_PASSWORD:pwd});
  if(r.success){
    $('msg-env-db').innerHTML='<div class="info-box success">鉁?'+r.message+' 璇风户缁笅涓€姝ラ厤缃€?/div>';
    // auto-fill password into step 1
    $('DB_PASSWORD').value=pwd;
    $('card-env').classList.remove('open');$('card-1').classList.add('open');
  }else{
    $('msg-env-db').innerHTML='<div class="info-box error">鉂?'+r.error+'</div>';
  }
}

async function saveConfig(){
  const body={
    DB_HOST:$('DB_HOST').value,DB_PORT:$('DB_PORT').value,
    DB_USER:$('DB_USER').value,DB_PASSWORD:$('DB_PASSWORD').value,
    DB_NAME:$('DB_NAME').value,PORT:$('PORT').value,
    JWT_SECRET:$('JWT_SECRET').value,AI_ENCRYPTION_KEY:$('AI_ENCRYPTION_KEY').value,
  };
  if(!body.DB_PASSWORD){alert('璇疯緭鍏ユ暟鎹簱瀵嗙爜');return;}
  const r=await api('/api/save-config','POST',body);
  if(r.success){
    setStepStatus(1,'done','宸查厤缃?);

    $('msg-1').innerHTML='<div class="info-box error">鉂?'+r.error+'</div>';
  }
}

let pollTimer=null;
async function runStep(action,stepNum){
  const urlMap={'install-deps':'/api/install-deps','init-db':'/api/init-db','build':'/api/build'};
  setStepStatus(stepNum,'running','杩涜涓?..');
  const con=$('console-'+stepNum);
  con.textContent='姝ｅ湪鍚姩...\n';
  const r=await api(urlMap[action],'POST');
  if(!r.success){
    setStepStatus(stepNum,'error','澶辫触');
    con.textContent='閿欒: '+(r.error||'鏈煡閿欒');
    return;
  }
  // poll task
  const taskId=r.taskId;
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    const tr=await api('/api/task/'+taskId);
    if(!tr.success)return;
    con.textContent=tr.data.output;
    con.scrollTop=con.scrollHeight;
    if(tr.data.status!=='running'){
      clearInterval(pollTimer);pollTimer=null;
      if(tr.data.status==='done'){
        setStepStatus(stepNum,'done','宸插畬鎴?);
        // auto open next
        $('card-'+stepNum).classList.remove('open');
        if($('card-'+(stepNum+1)))$('card-'+(stepNum+1)).classList.add('open');
      }else{
        setStepStatus(stepNum,'error','澶辫触');
      }
    }
  },1000);
}

function showServerRunning(port){
  const url='http://localhost:'+port;
  $('server-link').href=url;$('server-link').textContent=url;
  $('server-info').style.display='';
  $('btn-start').style.display='none';$('btn-stop').style.display='';
  setStepStatus(6,'done','杩愯涓?);
}

async function startServer(){
  setStepStatus(6,'running','鍚姩涓?..');
  const con=$('console-6');
  con.textContent='姝ｅ湪鍚姩...\n';
  const r=await api('/api/start-server','POST');
  if(!r.success){
    setStepStatus(6,'error','澶辫触');
    con.textContent='閿欒: '+r.error;
    return;
  }
  const taskId=r.taskId;
  const port=$('PORT').value||'3000';
  // poll for startup
  let checks=0;
  const timer=setInterval(async()=>{
    const tr=await api('/api/task/'+taskId);
    if(tr.success){con.textContent=tr.data.output;con.scrollTop=con.scrollHeight;}
    checks++;
    if(tr.success&&tr.data.status==='done'){
      clearInterval(timer);
      showServerRunning(port);
    }
    if(checks>30||(tr.success&&tr.data.status==='error')){
      clearInterval(timer);
      setStepStatus(6,'error','鍚姩澶辫触');
    }
  },1000);
}

async function stopServer(){
  const r=await api('/api/stop-server','POST');
  $('btn-start').style.display='';$('btn-stop').style.display='none';
  $('server-info').style.display='none';
  setStepStatus(6,'pending');
  $('console-6').textContent='鏈嶅姟鍣ㄥ凡鍋滄';
}
